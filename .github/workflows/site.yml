name: Example site

on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - 'week-*/**'
      - 'torchlean-tensor-programming/**'
      - 'lake-manifest.json'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - '.github/workflows/site.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'week-*/**'
      - 'torchlean-tensor-programming/**'
      - 'lake-manifest.json'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: example-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r site/requirements.txt
      - run: python site/build.py
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: build/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the examples
        id: deployment
        uses: actions/deploy-pages@v4
