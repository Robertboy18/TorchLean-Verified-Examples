<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1340" viewBox="0 0 360 1340" role="img" aria-labelledby="title description" font-family="IBM Plex Sans, system-ui, sans-serif"><title id="title">Estimation error against compute on random ReLU networks</title><desc id="description">Four panels, one per width, for depth-2 random ReLU networks with 64 sign inputs. Each shows relative error on a log scale against floating-point operations on a log scale. The dashed line is the exact error of plain sampling at each compute budget. Covariance propagation lies below the line at every width; means-and-variances lies below it at its small cost; certified averaging lies above it.</desc><metadata id="measurements">[{&quot;width&quot;: 16, &quot;sample_flops&quot;: 2657, &quot;per_sample&quot;: 1.0718433283995954, &quot;points&quot;: {&quot;C&quot;: [193736, 0.025023216089273694], &quot;D&quot;: [8864, 0.04483503571279025], &quot;A8&quot;: [628992, 0.6342551128234023]}, &quot;gain&quot;: 5.013335309212397}, {&quot;width&quot;: 64, &quot;sample_flops&quot;: 16769, &quot;per_sample&quot;: 1.0493091300073316, &quot;points&quot;: {&quot;C&quot;: [3556640, 0.007205468538534632], &quot;D&quot;: [50816, 0.03820015923028375], &quot;A8&quot;: [7236864, 0.6337406597158812]}, &quot;gain&quot;: 10.001687821096754}, {&quot;width&quot;: 256, &quot;sample_flops&quot;: 165377, &quot;per_sample&quot;: 0.991586239472386, &quot;points&quot;: {&quot;C&quot;: [82326656, 0.003586325664397489], &quot;D&quot;: [449024, 0.03532025487622513], &quot;A8&quot;: [104493312, 0.6325934246666713]}, &quot;gain&quot;: 12.389851348802113}, {&quot;width&quot;: 1024, &quot;sample_flops&quot;: 2234369, &quot;per_sample&quot;: 0.9391616596028088, &quot;points&quot;: {&quot;C&quot;: [2928857600, 0.0033590871470046], &quot;D&quot;: [5728256, 0.031169038773176932], &quot;A8&quot;: [1626718464, 0.6314106792593494]}, &quot;gain&quot;: 7.721785574573671}]</metadata><rect width="360" height="1340" fill="#ffffff"/>